method: asr
skills: [object, count, color, locate, relation, read, activity, attribute, existence, other]

spectral:
  radial_bins: 8
  angular_bins: 8
  eps: 1.0e-8
  selected_last_layers: 4
  frequency_mode: fftfreq
  fft_norm: ortho
  head_stat: variance
  normalize_peak_power: true

asr:
  beta: 0.5
  lambda_ang: 0.1
  tau_mah: 1.0
  alpha: 0.9
  tau_skill: 0.2
  cov_floor: 1.0e-4
  normalize_mahalanobis_by_dim: true
  gamma: 0.02

optim:
  lr: 0.001
  weight_decay: 0.01
  betas: [0.9, 0.999]
  epochs_per_stage: 2
  batch_size: 8
  max_grad_norm: 1.0
  cosine_decay: true
  warmup_steps: 0

model:
  kind: tiny
  hidden_dim: 32
  num_layers: 2
  num_heads: 4
  image_size: 128
  patch_size: 16
  vocab_size: 1024
  num_classes: 128
  max_seq_len: 48
  freeze_backbone: false

data:
  kind: jsonl
  manifest_dir: data/hf_cocoqa_tiny/manifests
  image_root: data/hf_cocoqa_tiny/images
  answer_vocab: data/hf_cocoqa_tiny/manifests/answer_vocab.json
  num_stages: 4
  max_seq_len: 48
  task_order: [object, count, color, locate]

runtime:
  device: cpu
  seed: 7
  num_workers: 0
  output_dir: runs/hf_cocoqa_tiny
  log_every: 4
  save_every_stage: true
  use_amp: false
