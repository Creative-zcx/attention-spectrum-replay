method: asr
skills: [count, color, locate, relation, read, object, activity, attribute, existence, other]

spectral:
  radial_bins: 8
  angular_bins: 8
  eps: 1.0e-8
  selected_last_layers: 4
  frequency_mode: fftfreq
  fft_norm: ortho
  head_stat: variance
  normalize_peak_power: true

asr:
  beta: 0.5
  lambda_ang: 0.1
  tau_mah: 1.0
  alpha: 0.9
  tau_skill: 0.2
  cov_floor: 1.0e-4
  normalize_mahalanobis_by_dim: true
  gamma: 0.02

optim:
  lr: 0.001
  weight_decay: 0.01
  betas: [0.9, 0.999]
  epochs_per_stage: 3
  batch_size: 8
  max_grad_norm: 1.0
  cosine_decay: true
  warmup_steps: 0

model:
  kind: tiny
  hidden_dim: 32
  num_layers: 2
  num_heads: 4
  image_size: 32
  patch_size: 8
  vocab_size: 256
  num_classes: 8
  max_seq_len: 32
  freeze_backbone: false

data:
  kind: synthetic
  num_stages: 3
  train_samples_per_stage: 64
  val_samples_per_stage: 32
  num_classes: 8
  seed: 123
  max_seq_len: 32

runtime:
  device: cpu
  seed: 7
  num_workers: 0
  output_dir: runs/local_synthetic
  log_every: 4
  save_every_stage: true
  use_amp: false
